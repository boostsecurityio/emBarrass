name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

env:
  # GitHub releases are the safe default. Set this repository or release
  # environment variable to "true" before tagging to also update the tap.
  PUBLISH_HOMEBREW: ${{ vars.PUBLISH_HOMEBREW || 'false' }}

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 20
    steps:
      # The repository's GITHUB_TOKEN publishes this repository's Release. A
      # separate, repository-scoped app token is used only for the tap because
      # GITHUB_TOKEN cannot write to boostsecurityio/homebrew-tap.
      - name: Mint Homebrew tap token
        if: ${{ env.PUBLISH_HOMEBREW == 'true' }}
        id: tap-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.DEPLOYER_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPLOYER_APP_KEY }}
          owner: boostsecurityio
          repositories: homebrew-tap

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5
        with:
          go-version: "1.27.3"
          cache: false

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          install-only: true
          version: "~> v2"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verify release inputs
        run: |
          go mod verify
          go test ./...
          goreleaser check

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ steps.tap-token.outputs.token }}
        run: goreleaser release --clean

      - name: Verify checksum signature
        run: |
          cosign verify-blob dist/checksums.txt \
            --bundle dist/checksums.txt.cosign.bundle \
            --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/tags/$GITHUB_REF_NAME" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
